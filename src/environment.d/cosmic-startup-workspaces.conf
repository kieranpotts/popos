# Installed by run/install to ~/.config/environment.d/cosmic-startup-workspaces.conf.
# Read by `systemd --user` at the start of a login session, which is what
# makes COSMIC_STARTUP_APPS available to autostart apps (unlike ~/.bashrc,
# which autostart does NOT source). Takes effect on the next fresh login —
# not hot-reloadable mid-session.
#
# Format: see the CONFIG block in src/cosmic-startup-workspaces.sh.
#
# app-ids below are best-guesses (Firefox: firefox, Ghostty:
# com.mitchellh.ghostty, VS Code: code, Zed: dev.zed.Zed) — verify each with
# `cos-cli info` on this machine and correct any that don't match before
# relying on this.
#
# The startup-workspaces script resolves each app's command against the
# systemd --user session's PATH, not your interactive shell's. An app
# installed to a user-local bin dir (e.g. Zed via https://zed.dev/install.sh,
# which installs to ~/.local/bin) is NOT on that PATH here — confirmed via
# `systemctl --user show-environment`, which only shows the system default
# even after adding a `PATH=%h/.local/bin:$PATH` line to this file and a
# full restart. /usr/lib/environment.d/99-environment.conf (symlinked from
# /etc/environment) hard-sets PATH as a plain literal, with no $PATH
# reference, and it wins regardless of the theoretical sort order. Rather
# than fight that precedence, use each such app's absolute binary path
# below instead of relying on PATH resolution at all.
#
# UPDATE: the script now prepends ~/.cargo/bin and ~/.local/bin to PATH
# itself (it has to, to find cos-cli), so bare command names in those dirs
# resolve fine. The absolute path kept below is harmless, not required.
#
# `%h` specifier expansion also turned out not to apply here — confirmed via
# `systemctl --user show-environment`, which showed the literal, unexpanded
# "%h" string — so this hardcodes the real home directory instead. This
# value is machine/user-specific, same as the rest of this repo.
COSMIC_STARTUP_APPS=1|firefox|firefox;2|ghostty|com.mitchellh.ghostty;3|code|code;4|/home/kieran/.local/bin/zed|dev.zed.Zed
